version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: foodbridge-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ""
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_DATABASE: food_donation
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./database/food_donation.sql:/docker-entrypoint-initdb.d/food_donation.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  db_data:
    driver: local
